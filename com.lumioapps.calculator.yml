Categories:
  - Science & Education
  - System
License: MIT
AuthorName: Lumio Apps
WebSite: https://github.com/lumio-apps/calculator
SourceCode: https://github.com/lumio-apps/calculator
IssueTracker: https://github.com/lumio-apps/calculator/issues
Changelog: https://github.com/lumio-apps/calculator/releases

AutoName: Calculator

RepoType: git
Repo: https://github.com/lumio-apps/calculator.git

Builds:
  - versionName: 1.3.2
    versionCode: 6
    commit: v1.3.2
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@REPLACE_WITH_FLUTTER_VERSION
    prebuild:
      - sed -i -e '/REQUEST_INSTALL_PACKAGES/d' -e '/android.permission.INTERNET/d' android/app/src/main/AndroidManifest.xml
      - sed -i -e '/signingConfig = /d' android/app/build.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --dart-define=SELF_UPDATE=false

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.3.2
CurrentVersionCode: 6
